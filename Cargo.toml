[package]
name = "textedit"
version = "0.1.0"
edition = "2021"
resolver = "2"

[dependencies]
# Window & Events
winit = { version = "0.30", features = ["android-native-activity"] }

# Graphics
wgpu = { version = "0.20", features = ["webgpu"] }
pollster = "0.3"
bytemuck = { version = "1.14", features = ["derive"] }

# Text & Unicode
ropey = "1.6"
unicode-segmentation = "1.10"

# Font Rasterization
fontdue = "0.7"

# Clipboard
arboard = "3.3"

# Filesystem & Serialization
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
thiserror = "1.0"

# Logging
log = "0.4"
env_logger = "0.10"

# Utilities
once_cell = "1.19"
uuid = { version = "1", features = ["v4"] }
dirs = "5"

# Menu bar
muda = "0.17"

# File dialogs
rfd = "0.15"

# Syntax highlighting
syntect = "5.3"

# Regex for enhanced search
regex = "1"

# Async runtime for LSP and file watching
tokio = { version = "1", features = ["rt-multi-thread", "sync", "process", "io-util", "time"] }

# File watching
notify = "6"

# LSP
tower-lsp = "0.20"
lsp-types = "0.95"

# Fuzzy matching
nucleo-matcher = "0.3"

# Parallel processing
rayon = "1"
walkdir = "2"

# Tree-sitter for code analysis
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-javascript = "0.21"
tree-sitter-typescript = "0.21"
tree-sitter-python = "0.21"
tree-sitter-json = "0.21"
tree-sitter-toml = "0.20"
tree-sitter-html = "0.20"
tree-sitter-css = "0.21"
tree-sitter-go = "0.21"
tree-sitter-c = "0.21"
tree-sitter-cpp = "0.21"
tree-sitter-md = "0.2"

[dev-dependencies]
tempfile = "3.8"
